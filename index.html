<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proxy Toolkit · 工具导航</title>
<style>
  :root{
    --bg: #0a0e12;
    --panel: #11161c;
    --panel-alt: #151c24;
    --border: #212b34;
    --text: #dce4ea;
    --muted: #7e8b96;
    --accent: #4fd8c4;
    --accent-dim: #2c6f66;
    --accent-2: #e8a944;
    --danger: #e8617a;
    --ok: #4ade80;
    --warn: #fbbf24;
    --blue: #60a5fa;
    --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    min-height:100vh;
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,216,196,0.06), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(232,169,68,0.05), transparent 35%);
  }
  .wrap{max-width:960px;margin:0 auto;padding:40px 24px 80px;}

  header{display:flex;align-items:center;gap:20px;margin-bottom:8px;}
  .branch-icon{flex:none;}
  h1{
    font-family:var(--mono);
    font-size:26px;
    letter-spacing:0.5px;
    margin:0;
    font-weight:700;
  }
  h1 .dim{color:var(--muted);font-weight:500;}
  .subtitle{color:var(--muted);font-size:13.5px;margin:6px 0 0 0;line-height:1.6;}
  .scanline{
    height:1px;
    margin:24px 0 32px;
    background:linear-gradient(90deg, transparent, var(--accent-dim) 15%, var(--border) 50%, var(--accent-dim) 85%, transparent);
    position:relative;
    overflow:hidden;
  }
  .scanline::after{
    content:'';
    position:absolute;top:0;left:-30%;width:30%;height:100%;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    animation:scan 3.5s ease-in-out infinite;
  }
  @keyframes scan{
    0%{left:-30%;}
    50%{left:100%;}
    100%{left:100%;}
  }
  @media (prefers-reduced-motion: reduce){
    .scanline::after{animation:none;display:none;}
  }

  .section-label{
    font-family:var(--mono);
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:1.4px;
    color:var(--muted);
    margin-bottom:16px;
  }

  .tools-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }

  .tool-card{
    display:block;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 22px 20px;
    text-decoration:none;
    color:inherit;
    transition:border-color .18s ease, transform .15s ease, box-shadow .18s ease;
    position:relative;
    overflow:hidden;
  }
  .tool-card::before{
    content:'';
    position:absolute;
    top:0;left:0;right:0;
    height:2px;
    background:linear-gradient(90deg, var(--accent), transparent 70%);
    opacity:0;
    transition:opacity .18s ease;
  }
  .tool-card:hover{
    border-color:var(--accent-dim);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,0.25);
  }
  .tool-card:hover::before{opacity:1;}
  .tool-card:active{transform:translateY(0);}

  .tool-card .icon{
    width:40px;height:40px;
    border-radius:9px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:15px;font-weight:700;
    margin-bottom:14px;
    flex:none;
  }
  .tool-card .icon.teal{background:rgba(79,216,196,0.12);color:var(--accent);}
  .tool-card .icon.amber{background:rgba(232,169,68,0.12);color:var(--accent-2);}
  .tool-card .icon.blue{background:rgba(96,165,250,0.12);color:var(--blue);}
  .tool-card .icon.rose{background:rgba(232,97,122,0.12);color:var(--danger);}
  .tool-card .icon.green{background:rgba(74,222,128,0.12);color:var(--ok);}

  .tool-card h3{
    font-family:var(--mono);
    font-size:15.5px;
    font-weight:600;
    margin:0 0 6px 0;
    letter-spacing:0.2px;
  }
  .tool-card p{
    color:var(--muted);
    font-size:12.5px;
    line-height:1.55;
    margin:0;
  }
  .tool-card .tags{
    display:flex;flex-wrap:wrap;gap:6px;
    margin-top:14px;
  }
  .tool-card .tag{
    font-size:10.5px;
    padding:2px 8px;
    border-radius:999px;
    background:var(--panel-alt);
    color:var(--muted);
    border:1px solid var(--border);
    font-family:var(--mono);
  }

  .tool-card.coming-soon{
    opacity:0.55;
    pointer-events:none;
    cursor:default;
  }
  .tool-card.coming-soon::after{
    content:'即将推出';
    position:absolute;
    top:14px;right:14px;
    font-size:10px;
    font-family:var(--mono);
    color:var(--muted);
    background:var(--panel-alt);
    border:1px solid var(--border);
    padding:2px 7px;
    border-radius:4px;
  }

  footer.page-footer{
    margin-top:48px;
    color:var(--muted);
    font-size:11.5px;
    text-align:center;
    line-height:1.8;
  }
  footer.page-footer a{
    color:var(--accent-dim);
    text-decoration:none;
  }
  footer.page-footer a:hover{color:var(--accent);}

  @media (max-width:480px){
    .wrap{padding:28px 16px 60px;}
    h1{font-size:22px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="branch-icon" width="46" height="46" viewBox="0 0 46 46" fill="none">
      <circle cx="8" cy="23" r="4" fill="#4fd8c4"/>
      <path d="M12 23 C20 23, 20 9, 30 9" stroke="#2c6f66" stroke-width="1.6" fill="none"/>
      <path d="M12 23 C20 23, 20 23, 30 23" stroke="#2c6f66" stroke-width="1.6" fill="none"/>
      <path d="M12 23 C20 23, 20 37, 30 37" stroke="#2c6f66" stroke-width="1.6" fill="none"/>
      <circle cx="33" cy="9" r="3" fill="#e8a944"/>
      <circle cx="33" cy="23" r="3" fill="#e8a944"/>
      <circle cx="33" cy="37" r="3" fill="#e8a944"/>
    </svg>
    <div>
      <h1>Proxy <span class="dim">Toolkit</span></h1>
      <p class="subtitle">本地代理工具箱 · 纯前端运行 · 数据不出本机</p>
    </div>
  </header>

  <div class="scanline"></div>

  <div class="section-label">可用工具</div>
  <div class="tools-grid" id="tools-grid">
    <!-- 由下方 TOOLS 数组自动渲染，添加新工具只需改数组 -->
  </div>

  <footer class="page-footer">
    纯前端本地处理 · 链接内容不会发送到任何服务器 · 使用前请确认合法合规
  </footer>
</div>

<script>
/**
 * 工具列表配置
 * 添加新页面时，在此数组追加一项即可：
 * {
 *   id:    '唯一标识',
 *   title: '显示名称',
 *   desc:  '简短说明',
 *   href:  '相对路径（同目录下的 html 文件）',
 *   icon:  '图标文字（1~3 字）',
 *   color: 'teal | amber | blue | rose | green',
 *   tags:  ['标签1', '标签2'],
 *   enabled: true  // false 时显示「即将推出」且不可点击
 * }
 */
const TOOLS = [
  {
    id: 'mihomo-converter',
    title: 'Mihomo 转换',
    desc: '多协议分享链接一键转 Mihomo (Clash Meta) YAML，支持 VMess / VLESS / SS / Trojan / TUIC / Hysteria2。',
    href: 'mihomo-converter.html',
    icon: 'MC',
    color: 'teal',
    tags: ['VMess', 'VLESS', 'SS', 'Trojan', 'TUIC', 'Hy2'],
    enabled: true,
  },
  {
    id: 'vless-fission',
    title: 'VLESS 裂变',
    desc: '保留 UUID 与加密参数，批量替换连接地址与端口，快速生成多条优选节点。',
    href: 'vless-fission.html',
    icon: 'VF',
    color: 'amber',
    tags: ['VLESS', '批量', '优选 IP'],
    enabled: true,
  },
  // —— 后续新工具在此追加，示例：——
  // {
  //   id: 'ss-batch',
  //   title: 'SS 批量生成',
  //   desc: '根据模板批量生成 Shadowsocks 节点。',
  //   href: 'ss-batch.html',
  //   icon: 'SS',
  //   color: 'blue',
  //   tags: ['SS', '批量'],
  //   enabled: false,
  // },
];

(function render() {
  const grid = document.getElementById('tools-grid');
  grid.innerHTML = TOOLS.map((t) => {
    const tags = (t.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join('');
    if (t.enabled === false) {
      return `
        <div class="tool-card coming-soon">
          <div class="icon ${t.color || 'teal'}">${t.icon || '?'}</div>
          <h3>${t.title}</h3>
          <p>${t.desc || ''}</p>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
        </div>`;
    }
    return `
      <a class="tool-card" href="${t.href}">
        <div class="icon ${t.color || 'teal'}">${t.icon || '?'}</div>
        <h3>${t.title}</h3>
        <p>${t.desc || ''}</p>
        ${tags ? `<div class="tags">${tags}</div>` : ''}
      </a>`;
  }).join('');
})();
</script>
</body>
</html>
